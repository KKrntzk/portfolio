<div class="content">
  <button (click)="useLanguage('en')" class="language-btn animation-container">
    <span class="en-span content">EN</span>
  </button>
  <button class="switch-btn" (click)="useLanguage(currentLang === 'en' ? 'de' : 'en')">
    <span class="slider" [class.is-de]="currentLang === 'de'"></span>
  </button>
  <button (click)="useLanguage('de')" class="language-btn animation-container">
    <span class="de-span content">DE</span>
  </button>
</div>
