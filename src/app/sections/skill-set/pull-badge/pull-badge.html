<div class="sticker-container">
  <input type="checkbox" id="peel-trigger" class="peel-checkbox" />
  <label for="peel-trigger" class="sticker-wrapper">
    <img src="/img/03_Stickers/peel-off/1.png" class="sticker img-1" alt="" />
    <img src="/img/03_Stickers/peel-off/2.png" class="sticker img-2" alt="" />
    <img src="/img/03_Stickers/peel-off/3.png" class="sticker img-3" alt="" />

    <span class="sticker-text"
      >{{ 'skills.stickerPullPart1' | translate }} <br />
      {{ 'skills.stickerPullPart2' | translate }}</span
    >
    <img src="/img/03_Stickers/Arrow.png" class="sticker-arrow" alt="" />

    <span class="finish-text">{{ 'skills.stickerFinish' | translate }}</span>
    <img src="/img/additionals/python-logo.png" class="finish-img" alt="" />
  </label>
</div>
